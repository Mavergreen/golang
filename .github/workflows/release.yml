name: release

# Builds BOTH go126 products on a modern Apple-Silicon runner. Three entry points:
#   - push to main   : build; if the current upstream (UPSTREAM_VERSION) has no release yet,
#                       auto-cut <upstream>-mavericks.1 (build/version.sh auto -> RELEASE=yes)
#   - a *-mavericks.* tag : publish that exact version
#   - workflow_dispatch with local_release=true : cut a local <upstream>-mavericks.(N+1) repackage
# Products:
#   - native (runs on 10.9): amd64/min-10.9 toolchain + x86_64 Sparkle updater + 10.9.5 floor
#   - cross  (runs on modern macOS, targets 10.9): native arm64 toolchain + arm64 Sparkle updater
# Each is EdDSA-signed with its own appcast (appcast.xml / appcast-cross.xml). Publishing is the
# shared publish-release.yml, which mints the tag itself (no PAT) and refuses an empty Release body.
# No 10.9 runner anywhere; the published artifacts are re-validated on a real 10.9 box out-of-band.

on:
  push:
    branches: [main]          # push to main: build; if upstream has no release yet, cut it
    tags: ['*-mavericks.*']   # a version tag publishes that exact version
  pull_request:
    branches: [main]          # PR build is the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a local -mavericks.(N+1) release for the current upstream version"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main HERE CAN PUBLISH (an upstream with no release yet auto-cuts -mavericks.1), and
# concurrency is resolved when a run is queued -- before the ver step decides whether this one
# releases -- so cancelling the run would cancel the publish job with it.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This repo ships ONE line (lines/126). Decide its version and whether it publishes ONCE here, and
  # let the other jobs read that decision rather than recompute it -- they must all agree about what
  # is being built.
  #
  # Deliberately NOT a matrix, though lines/ can hold several. A matrix leg's status context embeds
  # the version ("build (126, 1.26.8-mavericks.1)"), so it changes every release and can never be a
  # required status check -- which left every Renovate PR here stuck on "Expected — waiting for
  # status to be reported", unable to merge, for a month. A second line would also have coupled the
  # lines: `publish` needs the whole matrix, so a failing 1.27 would have blocked a ready 1.26 from
  # shipping. The family's answer is one repo per line, so this workflow builds one and says so.
  plan:
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.p.outputs.line }}
      version: ${{ steps.p.outputs.version }}
      any_publish: ${{ steps.p.outputs.any_publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build/version.sh counts existing <upstream>-mavericks.* tags
      - name: Install mavericks-shipyard
        uses: ModernMavericks/shipyard/.github/actions/install@v1
      - name: Decide the release plan, per line
        id: p
        run: |
          set -eu
          mode=auto
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
            mode=local
          fi
          # One line, asserted -- not assumed. If a second lines/ dir ever appears, this workflow
          # would silently build whichever the shell listed last and quietly not ship the other.
          n="$(ls -d lines/*/ 2>/dev/null | wc -l | tr -d ' ')"
          [ "$n" = 1 ] || { echo "::error::this workflow ships exactly one line, found $n in lines/ -- a second line belongs in its own repo"; exit 1; }
          d="$(ls -d lines/*/)"; line="$(basename "$d")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag names this line's release; anything else just builds.
            up="$(tr -d '[:space:]' < "$d/UPSTREAM_VERSION")"
            case "$GITHUB_REF_NAME" in
              "$up"-mavericks.*) full="$GITHUB_REF_NAME"; rel=yes ;;
              *) full="$(GO_LINE=$line sh build/version.sh auto | sed -n 's/^FULL=//p')"; rel=no ;;
            esac
          else
            out="$(GO_LINE=$line sh build/version.sh "$mode")"
            full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
            rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
            # only main cuts releases; PRs and other branches never publish
            [ "$GITHUB_REF_NAME" = main ] || rel=no
          fi
          echo "line $line -> $full (publish=$rel)"
          { echo "line=$line"; echo "version=$full"; } >> "$GITHUB_OUTPUT"
          if [ "$rel" = yes ]; then echo "any_publish=true" >> "$GITHUB_OUTPUT"; else echo "any_publish=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: plan
    env:
      GO_LINE: ${{ needs.plan.outputs.line }}
    runs-on: macos-26   # Apple Silicon (arm64) — mirrors local Tahoe; use macos-15 if 26 is unavailable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build/version.sh counts existing <upstream>-mavericks.* tags

      - name: Install mavericks-shipyard
        # shipyard installs itself via its own action: the pkg, which puts shipyard-cmake on PATH and
        # exports $SHIPYARD_SCRIPTS. We do NOT clone or build it by hand. @v1 is the moving major tag;
        # Renovate's github-actions manager tracks it (no SHA, no marker comment). shipyard's config
        # auto-scaffolds our .github/renovate.json. Consumed via find_package under shipyard-cmake.
        uses: ModernMavericks/shipyard/.github/actions/install@v1

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      # The plan job already decided this line's version; take it rather than recomputing, so every
      # job in the run agrees about what is being built. VERSION is written locally (never committed)
      # because the cmake configure and the updater bundle read it.
      - name: Take this line's version from the plan
        id: ver
        run: |
          set -eu
          full="${{ needs.plan.outputs.version }}"
          printf '%s\n' "$full" > VERSION
          { echo "full=$full"; echo "tag=$full"; } >> "$GITHUB_OUTPUT"
          echo "line=$GO_LINE version=$full"

      - name: Bootstrap Go (arm64, >= 1.24)
        uses: actions/setup-go@v7
        with: { go-version: '1.26.x' }

      - name: pkgsrc rename guard
        run: sh tests/trust/rename-check.sh

      - name: Trust-model unit tests
        run: GOROOT_BOOTSTRAP="$(go env GOROOT)" sh tests/trust/unit-trust.sh

      # The shared runner takes the whole top-level suite, so a newly added test runs the day it lands
      # instead of when someone remembers a CI line. Tests needing a built toolchain (compat-guard) or
      # a real 10.9 box (smoke-mavericks) exit 77 and report SKIP here; the compat guard's real gate is
      # its explicit post-build invocation below, which passes the shipped binaries.
      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      # The pin list the notes describe is derived from the repackage caller's own paths; fail if
      # that declaration resolves to nothing (a typo'd glob means no repackage AND no notes).
      - name: Guard the ingredient pin declaration
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      - name: Cross-build the native toolchain (Rosetta-free)
        run: sh build/build-native.sh

      - name: Compat guard on the shipped toolchain binaries
        run: |
          stage="$HOME/.cache/mavericks-golang/work/staging/usr/local/go126"
          sh tests/compat-guard.sh "$stage/bin/go" "$stage/bin/gofmt" "$stage"/pkg/tool/darwin_amd64/*

      - name: Optional amd64 self-test under Rosetta (best-effort, never gates)
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          sh tests/rosetta-selftest.sh || true

      - name: Build the Sparkle updater app (Cocoa/ObjC; must not link Go)
        run: |
          BUILD="build/updater"
          # find_package resolves MavericksShipyard from shipyard-cmake's own prefix (the pkg installed
          # above); no CMAKE_PREFIX_PATH, no vendored copy. The x86_64 Sparkle slice is auto-derived from
          # the native updater's CMAKE_OSX_ARCHITECTURES by mavericks_add_updater_app.
          shipyard-cmake -S . -B "$BUILD" -DCMAKE_OBJC_COMPILER=/usr/bin/clang
          shipyard-cmake --build "$BUILD" --target GoUpdater
          otool -L "$BUILD/GoUpdater.app/Contents/MacOS/GoUpdater" | tee /tmp/o.txt
          ! grep -qi 'usr/local/go126' /tmp/o.txt || { echo "::error::updater links the toolchain it updates"; exit 1; }

      - name: Package the native .pkg (updater + 10.9.5 floor) + tarball + manifest
        run: UPD_APP="build/updater/GoUpdater.app" sh build/package-pkg.sh

      # --- cross product (runs on modern macOS, targets 10.9) ---
      - name: Cross-build the cross toolchain (native arm64)
        run: sh build/build-cross.sh

      # A pure-Go program (no cgo) must come out 10.9-safe too: Go internal-links those unless the
      # toolchain defaults darwin/amd64 to external linking (patches 0011/0012). The top-level test
      # runner already ran this script before anything was built, where it SKIPs (77).
      - name: Pure-Go programs from the cross toolchain are 10.9-safe
        run: sh tests/pure-go-link.sh

      - name: Build the cross Sparkle updater app (native arm64)
        run: |
          BUILD="build/updater-cross"
          # The arm64 Sparkle slice is auto-derived from the cross updater's CMAKE_OSX_ARCHITECTURES
          # (arm64, set by MAVGO_VARIANT=cross) -- no hand-plumbed framework path.
          shipyard-cmake -S . -B "$BUILD" -DMAVGO_VARIANT=cross -DCMAKE_OBJC_COMPILER=/usr/bin/clang
          shipyard-cmake --build "$BUILD" --target GoCrossUpdater

      - name: Package the cross .pkg + tarball + manifest
        run: UPD_APP="build/updater-cross/GoCrossUpdater.app" sh build/package-cross-pkg.sh

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      # The body travels IN the artifact: publish-release.yml does not check out the repo. One call
      # writes the file both sign_and_appcast.sh invocations below (native + cross) and the Release
      # body consume -- the same bytes, so the page and Sparkle's update dialog cannot disagree.
      #
      # --min-os 10.9.5 describes the NATIVE .pkg (the flagship most users install), not the cross
      # variant -- the cross appcast below carries its own real floor (--min-os 11.0) independently.
      #
      # --line wants the upstream tag-glob prefix ("1.26"), NOT the product id GO_LINE ("126") this
      # job already carries -- GO_LINE names the install prefix (/usr/local/go126); it is not the
      # dotted version prefix every "<line>-mavericks.*" tag actually starts with. Passing GO_LINE
      # verbatim here would silently match no tag (none begins with "126"), which drops the
      # ingredient section AND the compare link on every future release -- confirmed by generating
      # both ways against this repo's real tags before wiring this in. Derived from VER, which the
      # plan job already resolved for this line.
      - name: Stage release notes
        run: |
          set -eu
          mkdir -p dist
          VER="${{ steps.ver.outputs.full }}"
          LINE="$(printf '%s' "$VER" | cut -d. -f1,2)"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "${{ steps.ver.outputs.tag }}" --version "$VER" \
            --product Go --line "$LINE" --min-os 10.9.5 \
            --out dist/RELEASE_NOTES.md

      - name: EdDSA-sign both .pkgs + generate both Sparkle appcasts
        if: needs.plan.outputs.any_publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh` -> needs auth (else 403 rate-limit)
        run: |
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          SH="$SHIPYARD_SCRIPTS"   # exported by install@v1; don't re-derive it from the registry
          [ -d "$SH" ] || { echo "::error::SHIPYARD_SCRIPTS not set by install@v1"; exit 1; }
          VER="${{ steps.ver.outputs.full }}"; TAG="${{ steps.ver.outputs.tag }}"
          OUT="$HOME/.cache/mavericks-golang/work/out"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          NPKG=$(ls "$OUT"/*native*.pkg | head -1)
          # sign_and_appcast.sh auto-fetches the prebuilt ed25519-sign, signs the pkg, and renders the appcast.
          # native -> appcast.xml (10.9.5 floor)
          sh "$SH/sign_and_appcast.sh" \
            --channel-title "Mavericks Go 1.26" --version "$VER" \
            --pkg-url "$base/$(basename "$NPKG")" --notes-file dist/RELEASE_NOTES.md \
            --pkg "$NPKG" --min-os 10.9.5 > "$OUT/appcast.xml"
          XPKG=$(ls "$OUT"/*cross*.pkg | head -1)
          # cross -> appcast-cross.xml (modern floor: the updater is arm64/min-11)
          sh "$SH/sign_and_appcast.sh" \
            --channel-title "Mavericks Go 1.26 (cross)" --version "$VER" \
            --pkg-url "$base/$(basename "$XPKG")" --notes-file dist/RELEASE_NOTES.md \
            --pkg "$XPKG" --min-os 11.0 > "$OUT/appcast-cross.xml"
          echo "=== appcast.xml ==="; cat "$OUT/appcast.xml"
          echo "=== appcast-cross.xml ==="; cat "$OUT/appcast-cross.xml"

      - name: Collect artifacts
        run: |
          OUT="$HOME/.cache/mavericks-golang/work/out"
          mkdir -p dist
          cp "$OUT"/*.pkg dist/                            # both products' installers (GHA installs via installer -pkg)
          for f in appcast.xml appcast-cross.xml; do [ -f "$OUT/$f" ] && cp "$OUT/$f" dist/ || true; done
          # What each variant was built from -- conformance compares them, and a reader can see it.
          for f in build-info-native.txt build-info-cross.txt; do [ -f "$OUT/$f" ] && cp "$OUT/$f" dist/ || true; done
          # dist/RELEASE_NOTES.md was already staged above -- the SAME bytes both appcasts used, so
          # the Release page and Sparkle's update dialog cannot tell two different stories.

      # Conformance: do the artifacts we are about to publish agree with each other and with the
      # family? Every piece is checked somewhere already -- the compat guard reads binaries,
      # set_install_floor stamps a floor, sign_and_appcast signs -- but nothing asserted they agree.
      # Gated like the signing step: a non-publishing build has no appcast, and this is a question
      # about a release, not about a build.
      - name: Artifact conformance
        if: needs.plan.outputs.any_publish == 'true'
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "${{ needs.plan.outputs.version }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
          # Behavior gate, per appcast: a client on this LINE's previous release must SEE this as an
          # upgrade -- a numeric sparkle:version ordering strictly after the last published tag IN THIS
          # LINE. Scope the tag search to the line (1.26.5-mavericks.5 -> glob 1.26.*) so 1.26.7
          # compares against 1.26.5, not a 1.27.0 shipped between. Both native + cross carry this VER.
          GLOB="$(printf '%s' "${{ needs.plan.outputs.version }}" | sed 's/-mavericks\..*//' | cut -d. -f1,2).*"
          for a in appcast.xml appcast-cross.xml; do
            sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "dist/$a" --version "${{ needs.plan.outputs.version }}" --upstream-glob "$GLOB"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: golang-go${{ needs.plan.outputs.line }}
          path: dist/*

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read). One artifact holds
  # both signed products (native + cross .pkg and both appcasts), so one scan covers everything
  # publish attaches -- and feed, which only copies those appcasts, follows publish.
  scan:
    needs: [plan, build]
    if: always() && (needs.plan.outputs.any_publish == 'true')   # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: ModernMavericks/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: golang-go${{ needs.plan.outputs.line }}
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [plan, build, scan]
    if: needs.plan.outputs.any_publish == 'true'
    permissions:
      contents: write
    uses: ModernMavericks/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.plan.outputs.version }}
      artifact: golang-go${{ needs.plan.outputs.line }}

  # The per-line UPDATE FEED. Sparkle installs poll a fixed URL, so it cannot be the repo's /latest/
  # release -- that follows whichever LINE published most recently, which would offer a 1.26 user a
  # 1.27 upgrade unasked and, once 1.26.7 ships after 1.27.0, leave 1.27 users seeing nothing at all.
  # Instead each line owns a `feed-<line>` release whose appcast assets are replaced on every publish
  # in that line. It is a prerelease so it stays out of the way of the real releases.
  feed:
    needs: [plan, publish]
    if: needs.plan.outputs.any_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: golang-go${{ needs.plan.outputs.line }}
          path: dist
      - name: Point feed-${{ needs.plan.outputs.line }} at ${{ needs.plan.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ needs.plan.outputs.line }}
          VER: ${{ needs.plan.outputs.version }}
        run: |
          set -eu
          ls dist/appcast.xml dist/appcast-cross.xml >/dev/null   # a feed with no appcast is a broken product
          # --repo on every call: this job downloads an artifact and never checks out, so `gh` has no
          # git remote to infer the repository from ("fatal: not a git repository").
          R="$GITHUB_REPOSITORY"
          if ! gh release view "feed-$LINE" --repo "$R" >/dev/null 2>&1; then
            gh release create "feed-$LINE" --repo "$R" --prerelease \
              --title "go$LINE update feed" \
              --notes "Sparkle appcast for the go$LINE line. Its assets are replaced on every go$LINE release; the tag itself never moves, which is the point -- installed updaters poll this URL and must never be handed another line's release."
          fi
          gh release upload "feed-$LINE" --repo "$R" dist/appcast.xml dist/appcast-cross.xml --clobber
          echo "feed-$LINE now serves $VER"
